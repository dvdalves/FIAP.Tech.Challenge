apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: oficina
  labels:
    app: oficina-api
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=<AZURE_POSTGRES_FQDN>;Port=5432;Database=oficina;Username=<AZURE_POSTGRES_USER>;Password=<AZURE_POSTGRES_PASSWORD>;Ssl Mode=Require"
  Jwt__Key: "configure-via-ci-cd"
