name: CI/CD Pipeline - SIAES Oficina Mecanica

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOCKER_IMAGE_NAME: "ghcr.io/dvdalves/fiap-tech-challenge-api"
  DOCKER_IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. BUILD E TESTES AUTOMATIZADOS
  # ============================================================================
  build-and-test:
    name: 🧪 Build & Testes Automatizados (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restaurar Dependências
        run: dotnet restore

      - name: 🔨 Compilar Solução
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Executar Testes Unitários e Integrados com Cobertura
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

  # ============================================================================
  # 2. CONTEINERIZAÇÃO (DOCKER BUILD)
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build & Validação de Imagem
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Compilar Imagem Docker da API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/FIAP.Tech.Challenge.API/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

  # ============================================================================
  # 3. VALIDAÇÃO DE INFRAESTRUTURA COMO CÓDIGO (TERRAFORM)
  # ============================================================================
  terraform-validate:
    name: 🏗️ Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: 🔍 Terraform Init & Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  # ============================================================================
  # 4. DEPLOY KUBERNETES & BANCO DE DADOS (CD)
  # ============================================================================
  deploy-kubernetes:
    name: 🚀 Deploy Kubernetes & Database (K8s Manifests)
    needs: [docker-build, terraform-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ☸️ Setup Kubectl & Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: 🔍 Validar e Gerar Manifestos Kubernetes (Kustomize Build)
        run: |
          echo "Compilando e validando manifestos declarativos do Kustomize..."
          kubectl kustomize k8s/ > manifests-generated.yaml
          cat manifests-generated.yaml
          echo "✅ Manifestos Kustomize validados com sucesso!"

      - name: 🔐 Obter credenciais do AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP || 'fiap-tech-challenge-rg' }}" \
            --name "${{ secrets.AZURE_AKS_NAME || 'oficina-aks-cluster' }}" \
            --overwrite-existing

      - name: 🔐 Configurar segredos da aplicação
        run: |
          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n oficina create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n oficina create secret generic api-secret \
            --from-literal=ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
            --from-literal=Jwt__Key="${{ secrets.JWT_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🚀 Aplicar manifests no AKS
        run: |
          kubectl apply -k k8s
          kubectl -n oficina set image deployment/api-deployment oficina-api="${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}"
          kubectl -n oficina rollout status deployment/api-deployment --timeout=180s
